# cargo-deny configuration. An advisory acknowledgement is the PM's call at gate.
[graph]
all-features = true

[advisories]
version = 2
# cargo-deny 0.20's `unmaintained` is a scope (all/workspace/transitive/none), not a severity.
# "none" keeps unmaintained-crate notices from failing the gate; vulnerabilities still fail.
unmaintained = "none"

[licenses]
version = 2
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
    "CC0-1.0",
    "MPL-2.0",
]

[bans]
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
